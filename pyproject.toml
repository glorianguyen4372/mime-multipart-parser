[project]
name = "mime-multipart-parser"
version = "0.1.0"
description = "Parses RFC 2046 multipart MIME bodies into part dictionaries with headers and decoded content."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
